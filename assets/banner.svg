<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Nguyen Minh Tho, software developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9dff"/>
      <stop offset="1" stop-color="#36d1a6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="18" fill="url(#grid)"/>
  <rect x="64" y="62" width="56" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="114" fill="#8fb4e8" font-size="16" font-weight="600" letter-spacing="2.5">SOFTWARE DEVELOPER · CAN THO, VIETNAM</text>
    <text x="64" y="170" fill="#ffffff" font-size="52" font-weight="700">Nguyen Minh Tho</text>
    <text x="64" y="210" fill="#c9d6ea" font-size="20">.NET and React web apps, Android, automation and applied machine learning.</text>
    <text x="64" y="246" fill="#8fa3bf" font-size="16">MSc student in Information Technology · Nam Can Tho University</text>

    <!-- code card -->
    <g transform="translate(860,52)">
      <rect width="356" height="196" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="24" cy="24" r="5" fill="#eb6834"/>
      <circle cx="42" cy="24" r="5" fill="#f5c04e"/>
      <circle cx="60" cy="24" r="5" fill="#36d1a6"/>
      <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15">
        <text x="24" y="66"><tspan fill="#c792ea">const</tspan><tspan fill="#ffffff"> tho = {</tspan></text>
        <text x="44" y="94"><tspan fill="#8fb4e8">backend</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#36d1a6">"ASP.NET Core"</tspan><tspan fill="#ffffff">,</tspan></text>
        <text x="44" y="120"><tspan fill="#8fb4e8">frontend</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#36d1a6">"React"</tspan><tspan fill="#ffffff">,</tspan></text>
        <text x="44" y="146"><tspan fill="#8fb4e8">mobile</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#36d1a6">"Kotlin"</tspan><tspan fill="#ffffff">,</tspan></text>
        <text x="44" y="172"><tspan fill="#8fb4e8">ml</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#36d1a6">"PyTorch"</tspan><tspan fill="#ffffff"> };</tspan></text>
      </g>
    </g>
  </g>
</svg>
